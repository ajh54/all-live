name: Build AllLive UWP (sideload)

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-uwp:
    # windows-2022 镜像预装了:
    #   Microsoft.VisualStudio.Workload.Universal (UWP 工作负载)
    #   Microsoft.VisualStudio.ComponentGroup.UWP.NetCoreAndStandard
    #   Microsoft.VisualStudio.ComponentGroup.MSIX.Packaging
    #   Windows SDK 10.0.19041.0 / 10.0.22621.0
    runs-on: windows-2022

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: 还原 NuGet 包
        # 工程用的是 PackageReference 风格，msbuild -t:Restore 比 nuget.exe restore 可靠
        run: >
          msbuild AllLive.sln
          /t:Restore
          /p:Configuration=Release
          /p:Platform=x64
          /v:minimal

      - name: 生成自签名证书
        id: cert
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=AllLiveDev" `
            -KeyUsage DigitalSignature `
            -FriendlyName "AllLive Dev" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $dir = Join-Path $env:GITHUB_WORKSPACE 'build'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $pw = ConvertTo-SecureString -String 'AllLive123!' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$dir/AllLiveDev.pfx" -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath "$dir/AllLiveDev.cer" | Out-Null
          Write-Host "证书指纹: $($cert.Thumbprint)"
          # 工程里钉死了作者的证书指纹，必须用新证书的指纹覆盖，否则签名阶段会报不匹配
          "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: 编译 UWP (Release x64)
        id: build
        shell: pwsh
        run: |
          # 直接编译整个解决方案（等同于 VS 的“生成解决方案”）。
          # 不要写成 /t:AllLive_UWP:Build —— 解决方案 metaproj 里的目标名
          # 对不上会报 MSB4057。
          # 走 sln 的另一个好处: 只有经过 sln 的配置映射, AllLive.Core 才会拿到
          # Release|Any CPU 从而定义 WINDOWS_UWP（作者预期的分支）。
          #
          # 固定使用 UseDotNetNativeToolchain=false（非 .NET Native）：
          #   斗鱼的本地签名改用纯托管 JS 引擎 Jint 实现，而 Jint 过不了
          #   .NET Native 的 AOT 编译器（实测：加 Jint 后 Native 编译必失败）。
          # 另外别让 Native 与非 Native 共用中间目录，否则会产出清单与载荷
          # 形态不一致的混合包。
          $msbuildArgs = @(
            'AllLive.sln',
            '/p:Configuration=Release',
            '/p:Platform=x64',
            '/p:AppxBundle=Never',
            '/p:UapAppxPackageBuildMode=SideloadOnly',
            '/p:GenerateAppxPackageOnBuild=true',
            '/p:UseDotNetNativeToolchain=false',
            "/p:AppxPackageDir=$env:GITHUB_WORKSPACE/build/AppPackages/",
            "/p:PackageCertificateKeyFile=$env:GITHUB_WORKSPACE/build/AllLiveDev.pfx",
            '/p:PackageCertificatePassword=AllLive123!',
            "/p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT",
            '/p:AppxPackageSigningEnabled=true',
            '/m',
            '/v:normal'
          )
          Write-Host "msbuild $($msbuildArgs -join ' ')"
          & msbuild @msbuildArgs 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: 提取编译错误到注解
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path build.log)) { Write-Host '没有 build.log'; exit 0 }
          $lines = Get-Content build.log
          $errs = $lines |
            Where-Object { $_ -match 'error [A-Z]{2,}\d+|error MSB\d+|error APPX\d+|Build FAILED|生成失败|MSB4057' } |
            Select-Object -Unique | Select-Object -First 25
          if ($errs.Count -gt 0) {
            foreach ($e in $errs) { Write-Host "::error::$($e.Trim())" }
          } else {
            Write-Host '::error::没匹配到典型错误行，下面输出日志尾部'
            $lines | Select-Object -Last 40 | ForEach-Object { Write-Host $_ }
          }

      - name: 产物自检（形态不一致就立刻失败）
        shell: pwsh
        run: |
          # 这里只检查"能真正判断产物好坏的项"。曾经误报过的几个文件已剔除：
          #   AllLive.UWP.dll            —— .NET Native 专有；非 Native 产物里本来就没有
          #   System.Memory/Buffers/Numerics.Vectors —— 由 UWP 框架提供，不必随包
          # （已与一个合法非 Native 产物逐项比对确认。）
          $layout = 'AllLive.UWP/bin/x64/Release'
          $problems = @()

          # 1) 关键判别项：主程序必须是"托管形态"。
          #    非 Native 时 AllLive.UWP.exe 本身就是托管程序集（约 350KB）；
          #    .NET Native 会把它编成本机映像，exe 只剩约 8KB 的壳，
          #    此时若清单却声明非 Native，就是混合产物 —— 装上去主界面闪一下就崩。
          $exe = Join-Path $layout 'AllLive.UWP.exe'
          if (-not (Test-Path $exe)) {
            Write-Host '::error::找不到 AllLive.UWP.exe'
            $problems += 'AllLive.UWP.exe'
          } else {
            $size = (Get-Item $exe).Length
            Write-Host ("  AllLive.UWP.exe  {0:N0} 字节" -f $size)
            if ($size -lt 65536) {
              Write-Host '::error::AllLive.UWP.exe 只有壳的大小(疑似 .NET Native 形态)，而清单却是非 Native —— 混合产物，装上会闪退'
              $problems += 'AllLive.UWP.exe 形态不对(疑似 Native 壳)'
            }
          }

          # 2) 斗鱼本地签名依赖必须随包发布（这两个不是框架自带的）
          foreach ($f in @('AllLive.Core.dll', 'Jint.dll', 'Acornima.dll')) {
            $p = Join-Path $layout $f
            if (Test-Path $p) {
              Write-Host ("  {0,-24} {1,10:N0} 字节  ✓" -f $f, (Get-Item $p).Length)
            } else {
              Write-Host ("  {0,-24} 缺失  ✗" -f $f)
              $problems += $f
            }
          }

          # 3) 清单声明的依赖类型必须与非 Native 编译一致
          $mf = Join-Path $layout 'AppxManifest.xml'
          if (Test-Path $mf) {
            if ((Get-Content $mf -Raw) -match 'Native\.Framework|Native\.Runtime') {
              Write-Host '::error::清单声明的是 .NET Native 依赖，却用非 Native 编译 —— 混合产物'
              $problems += 'AppxManifest 依赖声明'
            } else {
              Write-Host '  AppxManifest 依赖声明: 非 Native (CoreRuntime/CoreFramework) ✓'
            }
          } else {
            Write-Host '::error::找不到 AppxManifest.xml'
            $problems += 'AppxManifest.xml'
          }

          # 4) 包内布局：这一项是实测踩出来的坑，必须守住。
          #    MSIX 根目录的 AllLive.UWP.exe 必须是 ≈8KB 的本机启动器（负责拉起
          #    UWP 版 CoreCLR），托管主程序必须放在 entrypoint\ 下。
          #    如果托管 exe 被放到根目录，系统会用【桌面 .NET Framework】去加载它，
          #    启动即报“未能加载 System.Private.CoreLib”并闪退（异常码 e0434352）。
          $msix = Get-ChildItem build/AppPackages -Recurse -Filter '*.msix' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $msix) {
            Write-Host '::error::没有生成 msix，无法校验包内布局'
            $problems += 'msix'
          } else {
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip = [System.IO.Compression.ZipFile]::OpenRead($msix.FullName)
            try {
              $rootEntry = $zip.Entries | Where-Object { $_.FullName -eq 'AllLive.UWP.exe' }
              $entryEntry = $zip.Entries | Where-Object { $_.FullName -eq 'entrypoint/AllLive.UWP.exe' }
              if (-not $rootEntry) {
                Write-Host '::error::msix 根目录缺 AllLive.UWP.exe'
                $problems += 'msix 根 exe 缺失'
              } elseif ($rootEntry.Length -ge 65536) {
                Write-Host ("::error::msix 根目录的 AllLive.UWP.exe 有 {0:N0} 字节（托管程序集），应为 ≈8KB 的本机启动器" -f $rootEntry.Length)
                $problems += 'msix 根 exe 形态不对'
              } else {
                Write-Host ("  msix 根 AllLive.UWP.exe        {0,10:N0} 字节  (本机启动器) ✓" -f $rootEntry.Length)
              }
              if (-not $entryEntry) {
                Write-Host '::error::msix 缺 entrypoint\AllLive.UWP.exe（托管主程序）'
                $problems += 'msix entrypoint 缺失'
              } elseif ($entryEntry.Length -lt 65536) {
                Write-Host ("::error::entrypoint\AllLive.UWP.exe 只有 {0:N0} 字节，不像托管主程序" -f $entryEntry.Length)
                $problems += 'msix entrypoint 形态不对'
              } else {
                Write-Host ("  msix entrypoint\AllLive.UWP.exe {0,10:N0} 字节  (托管主程序) ✓" -f $entryEntry.Length)
              }
            } finally {
              $zip.Dispose()
            }
          }

          if ($problems.Count -gt 0) {
            Write-Host "::error::产物自检失败: $($problems -join ', ')"
            exit 1
          }
          Write-Host ''
          Write-Host '产物自检通过 ✓'

      - name: 列出产物
        if: always()
        shell: pwsh
        run: |
          Write-Host '--- AppPackages ---'
          Get-ChildItem -Recurse build/AppPackages -ErrorAction SilentlyContinue |
            Select-Object -First 40 FullName, Length

      - name: 上传 AppPackages (已签名 msix + 依赖 + 证书)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AllLive-AppPackages
          path: |
            build/AppPackages/**
            build/AllLiveDev.cer
          if-no-files-found: warn

      - name: 组装可直接注册的松散目录
        if: always()
        shell: pwsh
        run: |
          # Add-AppxPackage -Register 用的目录必须与 MSIX 包内布局一致：
          #   根目录 AllLive.UWP.exe       = ≈8KB 本机启动器
          #   entrypoint\AllLive.UWP.exe   = ≈350KB 托管主程序
          # 直接把 bin/x64/Release 拿来注册是错的：那里托管 exe 在根目录、
          # 启动器在 Core\ 子目录下，注册后系统会用桌面 .NET Framework 加载
          # 托管 exe，启动就崩（System.Private.CoreLib 加载失败 / e0434352）。
          # 最稳妥的做法：把已经打包好的 msix 解压出来当松散目录。
          $out = 'build/loose-layout'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $msix = Get-ChildItem build/AppPackages -Recurse -Filter '*.msix' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $msix) { Write-Host '::warning::没有 msix，跳过松散目录组装'; exit 0 }
          Copy-Item $msix.FullName "$out/package.zip" -Force
          Expand-Archive "$out/package.zip" -DestinationPath $out -Force
          Remove-Item "$out/package.zip" -Force -ErrorAction SilentlyContinue
          Remove-Item "$out/AppxSignature.p7x", "$out/AppxBlockMap.xml" -Force -ErrorAction SilentlyContinue
          Remove-Item "$out/[Content_Types].xml" -Force -ErrorAction SilentlyContinue
          Get-Item "$out/AllLive.UWP.exe", "$out/entrypoint/AllLive.UWP.exe" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host ("  {0}  {1:N0} 字节" -f $_.FullName, $_.Length) }

      - name: 上传松散目录 (供 Add-AppxPackage -Register，免证书)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AllLive-LooseLayout
          path: build/loose-layout/**
          if-no-files-found: warn

      - name: 上传编译日志 (失败时用来排查)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: build.log
          if-no-files-found: ignore
