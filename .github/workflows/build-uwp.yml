name: Build AllLive UWP (sideload)

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-uwp:
    # windows-2022 镜像预装了:
    #   Microsoft.VisualStudio.Workload.Universal (UWP 工作负载)
    #   Microsoft.VisualStudio.ComponentGroup.UWP.NetCoreAndStandard
    #   Microsoft.VisualStudio.ComponentGroup.MSIX.Packaging
    #   Windows SDK 10.0.19041.0 / 10.0.22621.0
    runs-on: windows-2022

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: 还原 NuGet 包
        # 工程用的是 PackageReference 风格，msbuild -t:Restore 比 nuget.exe restore 可靠
        run: >
          msbuild AllLive.sln
          /t:Restore
          /p:Configuration=Release
          /p:Platform=x64
          /v:minimal

      - name: 生成自签名证书
        id: cert
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=AllLiveDev" `
            -KeyUsage DigitalSignature `
            -FriendlyName "AllLive Dev" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $dir = Join-Path $env:GITHUB_WORKSPACE 'build'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $pw = ConvertTo-SecureString -String 'AllLive123!' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$dir/AllLiveDev.pfx" -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath "$dir/AllLiveDev.cer" | Out-Null
          Write-Host "证书指纹: $($cert.Thumbprint)"
          # 工程里钉死了作者的证书指纹，必须用新证书的指纹覆盖，否则签名阶段会报不匹配
          "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: 编译 UWP (Release x64)
        id: build
        shell: pwsh
        run: |
          # 直接编译整个解决方案（等同于 VS 的“生成解决方案”）。
          # 不要写成 /t:AllLive_UWP:Build —— 解决方案 metaproj 里的目标名
          # 对不上会报 MSB4057。
          # 走 sln 的另一个好处: 只有经过 sln 的配置映射, AllLive.Core 才会拿到
          # Release|Any CPU 从而定义 WINDOWS_UWP（作者预期的分支）。
          #
          # 固定使用 UseDotNetNativeToolchain=false（非 .NET Native），原因有二：
          #   1) 斗鱼的本地签名改用纯托管 JS 引擎 Jint 实现，而 Jint 过不了
          #      .NET Native 的 AOT 编译器（实测：加 Jint 后 Native 编译必失败）。
          #   2) 绝不能让失败的 Native 尝试与退路的非 Native 编译共用中间目录——
          #      那会产出“清单声明 Native 依赖、载荷却是非 Native”的混合包，
          #      装到机器上表现为主界面闪一下就崩（缺 System.Memory 等程序集）。
          $msbuildArgs = @(
            'AllLive.sln',
            '/p:Configuration=Release',
            '/p:Platform=x64',
            '/p:AppxBundle=Never',
            '/p:UapAppxPackageBuildMode=SideloadOnly',
            '/p:GenerateAppxPackageOnBuild=true',
            '/p:UseDotNetNativeToolchain=false',
            "/p:AppxPackageDir=$env:GITHUB_WORKSPACE/build/AppPackages/",
            "/p:PackageCertificateKeyFile=$env:GITHUB_WORKSPACE/build/AllLiveDev.pfx",
            '/p:PackageCertificatePassword=AllLive123!',
            "/p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT",
            '/p:AppxPackageSigningEnabled=true',
            '/m',
            '/v:normal'
          )
          Write-Host "msbuild $($msbuildArgs -join ' ')"
          & msbuild @msbuildArgs 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: 提取编译错误到注解
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path build.log)) { Write-Host '没有 build.log'; exit 0 }
          $lines = Get-Content build.log
          $errs = $lines |
            Where-Object { $_ -match 'error [A-Z]{2,}\d+|error MSB\d+|error APPX\d+|Build FAILED|生成失败|MSB4057' } |
            Select-Object -Unique | Select-Object -First 25
          if ($errs.Count -gt 0) {
            foreach ($e in $errs) { Write-Host "::error::$($e.Trim())" }
          } else {
            Write-Host '::error::没匹配到典型错误行，下面输出日志尾部'
            $lines | Select-Object -Last 40 | ForEach-Object { Write-Host $_ }
          }

      - name: 产物自检（缺程序集或清单不一致就立刻失败）
        shell: pwsh
        run: |
          # 非 .NET Native 的 UWP 包必须自带这些程序集，少一个装上去就是启动即崩。
          # Jint/Acornima 是斗鱼本地签名用的；System.Memory/Buffers/Unsafe/Vectors
          # 是 Jint 的依赖，必须随包发布。
          $layout = 'AllLive.UWP/bin/x64/Release'
          $required = @(
            'AllLive.UWP.exe',
            'AllLive.UWP.dll',
            'AllLive.Core.dll',
            'Jint.dll',
            'Acornima.dll',
            'System.Memory.dll',
            'System.Buffers.dll',
            'System.Runtime.CompilerServices.Unsafe.dll',
            'System.Numerics.Vectors.dll'
          )
          $missing = @()
          Write-Host "--- 产物清单 ($layout) ---"
          foreach ($f in $required) {
            $p = Join-Path $layout $f
            if (Test-Path $p) {
              Write-Host ("  {0,-46} {1,10:N0} 字节  ✓" -f $f, (Get-Item $p).Length)
            } else {
              Write-Host ("  {0,-46} 缺失  ✗" -f $f)
              $missing += $f
            }
          }

          # 清单声明的依赖必须与非 Native 一致
          $mf = Join-Path $layout 'AppxManifest.xml'
          if (Test-Path $mf) {
            $raw = Get-Content $mf -Raw
            if ($raw -match 'Native\.Framework|Native\.Runtime') {
              Write-Host '::error::产物清单声明的是 .NET Native 依赖，但实际用的是非 Native 编译 —— 这是混合产物，装上会闪退'
              $missing += 'AppxManifest 依赖声明不一致'
            } else {
              Write-Host ''
              Write-Host 'AppxManifest 依赖声明: 非 Native (CoreRuntime/CoreFramework) ✓'
            }
          } else {
            Write-Host '::error::找不到 AppxManifest.xml'
            $missing += 'AppxManifest.xml'
          }

          if ($missing.Count -gt 0) {
            Write-Host "::error::产物自检失败，缺少或异常: $($missing -join ', ')"
            exit 1
          }
          Write-Host ''
          Write-Host '产物自检通过 ✓'

      - name: 列出产物
        if: always()
        shell: pwsh
        run: |
          Write-Host '--- AppPackages ---'
          Get-ChildItem -Recurse build/AppPackages -ErrorAction SilentlyContinue |
            Select-Object -First 40 FullName, Length

      - name: 上传 AppPackages (已签名 msix + 依赖 + 证书)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AllLive-AppPackages
          path: |
            build/AppPackages/**
            build/AllLiveDev.cer
          if-no-files-found: warn

      - name: 上传松散目录 (供 Add-AppxPackage -Register，免证书)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AllLive-LooseLayout
          path: AllLive.UWP/bin/x64/Release/**
          if-no-files-found: warn

      - name: 上传编译日志 (失败时用来排查)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: build.log
          if-no-files-found: ignore
